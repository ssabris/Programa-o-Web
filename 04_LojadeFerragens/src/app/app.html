<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Loja de Ferragens</title>
  <style>
    :root {
      --cor-primaria: #8b2942;
      --cor-primaria-escura: #6e2035;
      --cor-escura: #5c1a2c;
      --cor-clara: #f7e3e3;
      --cor-caixa: #f2d3d3;
      --cor-texto: #5c1a2c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background-color: var(--cor-clara);
      color: var(--cor-texto);
      line-height: 1.5;
    }

    h1,
    h2,
    h3 {
      font-family: 'Courier New', monospace;
      color: var(--cor-escura);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: 600;
      font-family: inherit;
      padding: 8px 18px;
    }

    input {
      font-family: inherit;
      border: 1px solid #d9b8b8;
      padding: 8px 10px;
      background-color: #ffffff;
    }

    #cabecalho-principal {
      background-color: var(--cor-primaria);
      color: #ffffff;
    }

    #rodape-principal {
      background-color: var(--cor-escura);
      color: #ffffff;
      text-align: center;
      padding: 16px;
    }

    header h1 {
      color: #ffffff;
    }

    nav a {
      color: #ffffff;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
      opacity: 0.85;
    }

    .site-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
    }

    .site-header nav {
      display: flex;
      gap: 16px;
    }

    .busca-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .busca-btn {
      background-color: var(--cor-escura);
      color: #ffffff;
    }

    .busca-btn:hover {
      background-color: var(--cor-primaria-escura);
    }

    #busca {
      width: 220px;
      max-width: 60vw;
    }

    #vitrine-produtos {
      padding: 48px 24px;
    }

    article {
      background-color: var(--cor-caixa);
      text-align: center;
      transition: transform 0.2s ease;
    }

    article:hover {
      transform: translateY(-4px);
    }

    h3 {
      font-size: 1.05rem;
      margin: 12px 0 8px;
    }

    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .produto-card {
      padding: 20px;
    }

    .produto-img {
      font-size: 2.8rem;
      background-color: #ffffff;
      padding: 24px 0;
    }

    .preco {
      color: var(--cor-primaria);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .btn-comprar {
      background-color: var(--cor-primaria);
      color: #ffffff;
      width: 100%;
      padding: 10px;
    }

    .btn-comprar:hover {
      background-color: var(--cor-primaria-escura);
    }

    @media (max-width: 768px) {
      .site-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 16px;
      }

      .produtos-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 16px;
      }
    }
  </style>
</head>

<body>

  <header id="cabecalho-principal" class="site-header">
    <h1>Loja de Ferragens</h1>
    <div class="busca-wrapper">
      <input type="text" id="busca" placeholder="Buscar produto...">
      <button class="busca-btn">ok</button>
    </div>
    <nav>
      <a href="cadastro">meu cadastro</a> |
      <a href="vitrine">Promoções</a> |
    </nav>
  </header>

  <section id="vitrine-produtos">
    <h2>Promoções da Semana</h2>
    <div class="produtos-grid">

      <article class="produto-card">
        <div class="produto-img"></div>
        <h3>Martelo Profissional</h3>
        <p class="preco">R$ 29,90</p>
        <button class="btn-comprar">Comprar</button>
      </article>

      <article class="produto-card">
        <div class="produto-img"></div>
        <h3>Furadeira/Parafusadeira</h3>
        <p class="preco">R$ 189,90</p>
        <button class="btn-comprar">Comprar</button>
      </article>

      <article class="produto-card">
        <div class="produto-img"></div>
        <h3>Kit Parafusos (100un)</h3>
        <p class="preco">R$ 14,90</p>
        <button class="btn-comprar">Comprar</button>
      </article>

      <article class="produto-card">
        <div class="produto-img"></div>
        <h3>Lata de Tinta 18L</h3>
        <p class="preco">R$ 149,90</p>
        <button class="btn-comprar">Comprar</button>
      </article>

      <article class="produto-card">
        <div class="produto-img"></div>
        <h3>Escada de Alumínio 5 Degraus</h3>
        <p class="preco">R$ 219,90</p>
        <button class="btn-comprar">Comprar</button>
      </article>

    </div>
  </section>

  <footer id="rodape-principal">
    Rodape
    <br>
    <div class="busca-wrapper" style="justify-content:center; margin-top:8px;">
      <input type="text" placeholder="Buscar produto...">
      <button class="busca-btn">ok</button>
    </div>
  </footer>

</body>

</html>
