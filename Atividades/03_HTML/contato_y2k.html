<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Contato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --cream: #f6f1e7;
        --ink: #26211c;
        --pink: #f3a7c7;
        --lime: #eef26e;
        --periwinkle: #8a8fdd;
        --coral: #e2543a;
        --line: #26211c;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 60px 24px;
        background-color: var(--cream);
        background-image: radial-gradient(#e7e0cf 1.5px, transparent 1.5px);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
    }

    .page {
        max-width: 980px;
        margin: 0 auto;
        position: relative;
    }

    /* ---------- decorações ---------- */

    .sparkle {
        position: absolute;
        color: var(--periwinkle);
        font-size: 26px;
        line-height: 1;
        pointer-events: none;
    }

    .tape {
        position: absolute;
        top: -18px;
        left: -10px;
        background: var(--pink);
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 2px;
        padding: 8px 18px;
        transform: rotate(-6deg);
        border: 2px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink);
    }

    .flower {
        position: absolute;
        left: 6px;
        top: 78px;
    }

    .badge {
        position: absolute;
        top: -10px;
        right: 0;
        width: 150px;
        height: 150px;
    }

    @media (max-width: 760px) {
        .badge { display: none; }
        .sparkle { display: none; }
    }

    /* ---------- topo ---------- */

    .top {
        position: relative;
        text-align: center;
        padding: 70px 20px 30px 20px;
    }

    h1 {
        font-family: "Alfa Slab One", serif;
        font-weight: normal;
        font-size: 58px;
        margin: 0 0 14px 0;
        color: var(--ink);
        letter-spacing: 1px;
    }

    .subtitle {
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--ink);
        opacity: 0.75;
        margin: 0 0 26px 0;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 22px;
    }

    .tags span {
        background: var(--lime);
        border: 2px solid var(--ink);
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .see-products {
        font-size: 14px;
    }

    .see-products a {
        color: var(--coral);
        font-weight: 700;
        text-decoration: none;
        border-bottom: 2px solid var(--coral);
    }

    .see-products a:hover {
        opacity: 0.7;
    }

    /* ---------- formulário ---------- */

    form {
        max-width: 620px;
        margin: 10px auto 0 auto;
        padding: 0 4px;
    }

    .campo {
        margin-bottom: 14px;
    }

    .campo-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: var(--ink);
    }

    .campo-label .req {
        color: var(--coral);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
        width: 100%;
        border: 2.5px solid var(--ink);
        border-radius: 10px;
        padding: 13px 16px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 15px;
        font-weight: 500;
        background: #fffdf8;
        color: var(--ink);
    }

    input::placeholder,
    textarea::placeholder {
        color: #a19c8f;
        font-weight: 500;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--periwinkle);
        box-shadow: 3px 3px 0 var(--periwinkle);
    }

    input[type="text"]#nome,
    input[type="email"]#email {
        background: var(--lime);
    }

    input[type="tel"]#telefone {
        background: #fffdf8;
    }

    select#assunto {
        background: #fffdf8;
        cursor: pointer;
    }

    textarea {
        resize: none;
        height: 110px;
    }

    .radio-row {
        display: flex;
        align-items: center;
        gap: 20px;
        border: 2.5px solid var(--ink);
        border-radius: 10px;
        padding: 12px 16px;
        background: #fffdf8;
    }

    .radio-option {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        font-size: 14px;
    }

    .radio-option input {
        width: 16px;
        height: 16px;
        accent-color: var(--periwinkle);
    }

    .submit-row {
        text-align: center;
        margin-top: 26px;
    }

    input[type="submit"] {
        background: var(--periwinkle);
        color: #ffffff;
        border: 2.5px solid var(--ink);
        border-radius: 40px;
        padding: 14px 46px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0 var(--ink);
    }

    input[type="submit"]:hover {
        background: #7175c9;
    }

    input[type="submit"]:active {
        box-shadow: 1px 1px 0 var(--ink);
        transform: translate(3px, 3px);
    }

    small.hint {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #8a8478;
    }
</style>
</head>
<body>

<div class="page">

    <span class="sparkle" style="top:20px; left:0;">✦</span>
    <span class="sparkle" style="top:120px; right:170px;">✦</span>
    <span class="sparkle" style="bottom:-10px; left:120px;">✦</span>

    <div class="top">

        <span class="tape">CONTATO</span>

        <svg class="flower" width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="7"  r="6" fill="var(--periwinkle)" stroke="var(--ink)" stroke-width="2"/>
            <circle cx="17" cy="27" r="6" fill="var(--periwinkle)" stroke="var(--ink)" stroke-width="2"/>
            <circle cx="7"  cy="17" r="6" fill="var(--periwinkle)" stroke="var(--ink)" stroke-width="2"/>
            <circle cx="27" cy="17" r="6" fill="var(--periwinkle)" stroke="var(--ink)" stroke-width="2"/>
            <circle cx="17" cy="17" r="6" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>
        </svg>

        <svg class="badge" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="70" fill="var(--pink)" stroke="var(--ink)" stroke-width="2.5"/>
            <path id="circlePath" d="M 75,75 m -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0" fill="none"/>
            <text font-family="Space Grotesk" font-weight="700" font-size="10.5" letter-spacing="2" fill="var(--ink)">
                <textPath href="#circlePath" startOffset="0%">
                    RESPOSTA RÁPIDA • FALE COM A GENTE •
                </textPath>
            </text>
            <text x="75" y="70" text-anchor="middle" font-family="Alfa Slab One" font-size="19" fill="var(--ink)">OI!</text>
            <text x="75" y="90" text-anchor="middle" font-family="Alfa Slab One" font-size="19" fill="var(--ink)">OI!</text>
        </svg>

        <h1>Fale com a gente</h1>
        <p class="subtitle">Preencha o formulário abaixo para</p>

        <div class="tags">
            <span>Dúvidas</span>
            <span>Sugestões</span>
            <span>Críticas</span>
            <span>Orçamentos</span>
        </div>

        <p class="see-products">Caso queira ver nossos produtos, clique <a href="#">aqui</a></p>

    </div>

    <form action="#" method="post">

        <div class="campo">
            <label class="campo-label" for="nome">Nome <span class="req">*</span></label>
            <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>
        </div>

        <div class="campo">
            <label class="campo-label" for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" placeholder="digite seu email" required>
        </div>

        <div class="campo">
            <label class="campo-label" for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="99999-9999"
                   pattern="\d{5}-\d{4}" title="Formato esperado: 99999-9999">
            <small class="hint">formato: 99999-9999</small>
        </div>

        <div class="campo">
            <label class="campo-label" for="assunto">Assunto</label>
            <select id="assunto" name="assunto">
                <option value="duvidas">Dúvidas</option>
                <option value="sugestoes">Sugestões</option>
                <option value="criticas">Críticas</option>
                <option value="orcamentos">Orçamentos</option>
            </select>
        </div>

        <div class="campo">
            <label class="campo-label">Deseja receber uma cópia deste e-mail?</label>
            <div class="radio-row">
                <span class="radio-option">
                    <input type="radio" id="copiaSim" name="copia" value="sim">
                    <label for="copiaSim">Sim</label>
                </span>
                <span class="radio-option">
                    <input type="radio" id="copiaNao" name="copia" value="nao">
                    <label for="copiaNao">Não</label>
                </span>
            </div>
        </div>

        <div class="campo">
            <label class="campo-label" for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="digite sua mensagem"></textarea>
        </div>

        <div class="submit-row">
            <input type="submit" value="Enviar ✦">
        </div>

    </form>

</div>

</body>
</html>
