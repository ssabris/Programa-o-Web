<section id="form-cadastro">
  <h2>Cadastro de Cliente</h2>
  <form>
    <div class="campo">
      <label for="nomeCliente">Nome completo</label>
      <input type="text" id="nomeCliente" placeholder="Digite seu nome">
    </div>

    <div class="campo">
      <label for="telefoneCliente">Telefone</label>
      <input type="tel" id="telefoneCliente" placeholder="(00) 00000-0000">
    </div>

    <div class="campo">
      <label for="enderecoCliente">Endereço de entrega</label>
      <input type="text" id="enderecoCliente" placeholder="Rua, número, bairro">
    </div>

    <div class="campo">
      <label for="tipoCliente">Tipo de cliente</label>
      <select id="tipoCliente">
        <option value="pessoa-fisica">Pessoa física</option>
        <option value="pessoa-juridica">Pessoa jurídica / obra</option>
      </select>
    </div>

    <button type="submit" class="btn-cadastrar">Cadastrar</button>
  </form>
</section>
